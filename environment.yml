name: xeus-kernel
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python
  - numpy
  - pandas
  # pandas Styler renders the semantic matrix and meta-analysis tables.
  - jinja2>=3.1
  - scipy
  - matplotlib
  # Plotly <6.3 uses Natural Earth-only base geometry.
  - plotly=6.2.0
  - nbformat>=4.2
  - ipywidgets
