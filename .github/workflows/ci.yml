name: Test repository

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m compileall -q content scripts tests
      - name: Fetch and validate the public-domain baseline
        run: |
          python scripts/fetch_plos_2015.py --output-dir content/data
          python scripts/validate_outputs.py --data-dir content/data
      - name: Validate notebook splash images and chapter coverage
        run: python scripts/validate_site.py
      - name: Build all Jupyter Book chapters
        run: python scripts/build_book.py
