name: Discover current HIVDB surveillance data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Capture one surveillance-map page load
        run: python scripts/capture_current_hivdb.py --output-dir captured_hivdb
      - uses: actions/upload-artifact@v4
        with:
          name: current-hivdb-network-discovery
          path: captured_hivdb/
