name: Build and deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "2.0.5-0"
          init-shell: bash
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch published HIVDB/PLOS surveillance snapshot
        run: python scripts/fetch_plos_2015.py --output-dir content/data
      - name: Validate generated data
        run: python scripts/validate_outputs.py --data-dir content/data
      - name: Configure fresh browser storage for this deployment
        run: |
          cat > jupyter-lite.json <<EOF
          {
            "jupyter-lite-schema-version": 0,
            "jupyter-config-data": {
              "enableServiceWorkerCache": false,
              "contentsStorageName": "HIVDR-JupyterLite-${GITHUB_SHA}",
              "versionInfo": {
                "deployment": {
                  "label": "GitHub commit",
                  "version": "${GITHUB_SHA}"
                }
              }
            }
          }
          EOF
      - name: Build JupyterLite
        run: |
          jupyter lite build --contents content --output-dir dist
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
